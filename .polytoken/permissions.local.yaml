version: 2
allow:
- tool: web_fetch
  args:
    url: https://openweathermap.org/api/weather-map-2{,/**}
- tool: web_fetch
  args:
    url: https://openweathermap.org/weathermap{,/**}
- tool: shell_exec
  args:
    command_tokens:
    - quarto
    - render
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - chmod
    - '+x'
    - '*'
- tool: web_fetch
  args:
    url: https://docs.polytoken.dev/reference/configuration{,/**}
- tool: shell_exec
  args:
    command_tokens:
    - polytoken
    - vfs
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - sed
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - sort
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - uniq
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - xxd
    - '*'
- tool: web_search
- tool: web_fetch
  args:
    url: https://docs.polytoken.dev/harness-engineering/subagents{,/**}
- tool: web_fetch
  args:
    url: https://ollama.com/search{,/**}
- tool: web_fetch
  args:
    url: https://docs.polytoken.dev/harness-engineering/facets{,/**}
- tool: shell_exec
  args:
    command_tokens:
    - env
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - od
    - '*'
- tool: web_fetch
  args:
    url: https://playwright.dev/docs/actionability{,/**}
- tool: web_fetch
  args:
    url: https://developer.chrome.com/docs/lighthouse/overview{,/**}
- tool: web_fetch
  args:
    url: https://playwright.dev/docs/emulation{,/**}
- tool: shell_exec
  args:
    command_tokens:
    - node
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - python3
    - '*'
- tool: shell_exec
  args:
    command_tokens:
    - curl
    - '*'
filesystem:
  allow:
  - access:
    - read
    path: ~/.config/polytoken/config.yaml
  - access:
    - read
    - write
    path: ~/.config/polytoken/config.yaml
